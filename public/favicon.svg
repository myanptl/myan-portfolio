<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="MP">
  <!-- The MP monogram from the header, black and white.
       Replaces a lilac chrome blob that belonged to the blue-to-purple build
       and carried a 7px corner radius, which the rest of the site does not use
       anywhere.

       The letterforms are paths rather than <text>. SVG favicons do not
       reliably have the page's fonts available, and a text node would fall
       back to whatever the browser picks, so the mark would differ per
       machine. Paths render identically everywhere and stay legible at 16px.

       The square carries its own ground, so the mark reads on a light or a
       dark browser tab without needing a colour-scheme swap. -->
  <rect width="32" height="32" fill="#0c0c0d"/>

  <!-- M -->
  <path
    fill="#eeece7"
    d="M4.6 23V9h2.9l2.6 6.4L12.7 9h2.9v14h-2.4v-8.5l-1.8 4.4H9.9l-1.8-4.4V23z"
  />

  <!-- P, with the counter cut by the even-odd rule -->
  <path
    fill="#eeece7"
    fill-rule="evenodd"
    d="M17.6 9h5.9a4 4 0 0 1 0 8h-3.4v6h-2.5zm2.5 2.4v3.2h3.2a1.6 1.6 0 0 0 0-3.2z"
  />
</svg>
