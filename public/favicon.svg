<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- The chrome blob from the hero, reduced to a tab-sized mark: a lilac
       metal form on the site's ink ground. Replaces the old terminal prompt,
       which belonged to the previous "syntax on paper" identity. -->
  <defs>
    <radialGradient id="metal" cx="34%" cy="28%" r="82%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="26%" stop-color="#e2d8fb"/>
      <stop offset="52%" stop-color="#a08ee0"/>
      <stop offset="78%" stop-color="#6b57ab"/>
      <stop offset="100%" stop-color="#2f2748"/>
    </radialGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="45%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="32" height="32" rx="7" fill="#0c0c0d"/>

  <!-- Slightly irregular, the way the shader's merged blobs read. -->
  <path
    d="M16 5.6c5.1 0 9.9 3.6 10.2 9.1.3 5.7-3.9 11.7-9.6 11.7-5.9 0-10.6-4.4-10.6-10.2 0-6 4.5-10.6 10-10.6z"
    fill="url(#metal)"
  />
  <path
    d="M16 5.6c5.1 0 9.9 3.6 10.2 9.1.3 5.7-3.9 11.7-9.6 11.7-5.9 0-10.6-4.4-10.6-10.2 0-6 4.5-10.6 10-10.6z"
    fill="url(#sheen)"
  />
</svg>
